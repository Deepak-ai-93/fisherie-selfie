<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>I Support Blue Economy — Gujarat Fisheries</title>
<style>
:root{
  --abyss:#04263f;--deep:#0a4d72;--tide:#1b8fc4;--foam:#dff3fb;--paper:#fff;--ink:#04263f;
  --green:#1a8a4a;--ratio:calc(1350/1080); /* 4:5 */
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--abyss);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}

/* ── Layout ───────────────────────────────────────────── */
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}

/*
 * 4:5 stage (1080×1350).
 * Width = min(100vw, (availH) / 1.25)
 * Height = width × 1.25
 */
#stage{
  position:relative;overflow:hidden;background:#000;flex:none;
  width:min(100vw, calc((100vh - 130px) / 1.25));
  height:min(calc(100vw * 1.25), calc(100vh - 130px));
}

/* All layers fill the stage absolutely */
#video,#frame,#shot{position:absolute;inset:0;width:100%;height:100%;}
#video{object-fit:cover;z-index:1;}
#video.mirror{transform:scaleX(-1);}
#frame{object-fit:cover;z-index:3;pointer-events:none;}
#shot{object-fit:cover;z-index:5;display:none;}

/* Created@Topclues credit */
#credit{
  position:absolute;left:6px;top:50%;z-index:4;pointer-events:none;
  transform:translateY(-50%) rotate(-90deg);transform-origin:center center;
  font-size:11px;font-weight:700;letter-spacing:.05em;color:#000;white-space:nowrap;
  text-shadow:0 0 4px rgba(255,255,255,.8);
}

/* Server-save status badge — top-left */
#saveBadge{
  position:absolute;top:10px;left:10px;z-index:6;
  display:none;align-items:center;gap:5px;
  background:rgba(26,138,74,.92);color:#fff;
  font-size:11px;font-weight:700;letter-spacing:.02em;
  padding:5px 10px;border-radius:20px;
  backdrop-filter:blur(4px);
}
#saveBadge.show{display:flex;}
#saveBadge svg{width:13px;height:13px;}
#saveBadge.error{background:rgba(180,40,40,.9);}

/* Flip camera button */
#flip{
  position:absolute;top:10px;right:10px;z-index:6;
  width:42px;height:42px;border-radius:50%;border:none;
  background:rgba(4,38,63,.6);backdrop-filter:blur(6px);
  color:var(--foam);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:opacity .2s;
}
#flip:active{opacity:.6;}
#flip svg{width:22px;height:22px;}

/* Gate */
#gate{
  position:absolute;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:24px;
  background:linear-gradient(150deg,var(--abyss) 0%,var(--deep) 100%);
  color:var(--foam);text-align:center;
}
#gate.hidden{display:none;}
.gate-logo{width:110px;max-width:50%;height:auto;margin-bottom:2px;}
#gate h1{font-size:20px;font-weight:800;line-height:1.2;letter-spacing:-.01em;}
#gate p{font-size:13px;opacity:.8;max-width:260px;line-height:1.5;}
.gate-consent{
  display:flex;align-items:flex-start;gap:10px;max-width:270px;
  text-align:left;font-size:12px;line-height:1.45;color:var(--foam);opacity:.9;
}
.gate-consent input{margin-top:1px;width:18px;height:18px;flex:none;accent-color:var(--tide);}
#startBtn{
  margin-top:4px;background:var(--foam);color:var(--abyss);border:none;
  font-size:15px;font-weight:700;padding:13px 28px;border-radius:30px;cursor:pointer;
}
#startBtn:disabled{opacity:.38;cursor:not-allowed;}
#startBtn:not(:disabled):active{transform:scale(.95);}

/* Bar */
#bar{
  width:100%;flex:none;display:flex;align-items:center;justify-content:center;gap:24px;
  padding:16px 20px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,var(--abyss),var(--deep));
}
.btn{
  border:none;background:rgba(255,255,255,.1);color:var(--foam);
  font-size:12px;font-weight:600;display:flex;flex-direction:column;
  align-items:center;gap:5px;cursor:pointer;width:60px;padding:8px 4px;
  border-radius:14px;transition:transform .1s;
}
.btn:active{transform:scale(.9);}
.btn svg{width:24px;height:24px;}
.btn:disabled{opacity:.3;pointer-events:none;}
#shutter{
  width:74px;height:74px;border-radius:50%;border:4px solid var(--foam);
  background:radial-gradient(circle at 50% 38%,#3ec3f0,var(--tide));
  box-shadow:0 0 0 6px rgba(27,143,196,.25),0 6px 20px rgba(0,0,0,.4);
  cursor:pointer;transition:transform .1s;flex:none;
}
#shutter:active{transform:scale(.88);}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(16px);
  background:var(--paper);color:var(--ink);font-size:13px;font-weight:600;
  padding:11px 18px;border-radius:24px;box-shadow:0 8px 24px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  z-index:60;text-align:center;max-width:82%;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Share sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(2,14,26,.6);}
#sheet.open{display:flex;}
.sheet-card{
  width:100%;max-width:520px;background:var(--paper);color:var(--ink);
  border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 32px rgba(0,0,0,.3);
}
.sheet-card h2{font-size:17px;font-weight:800;margin-bottom:4px;}
.sheet-card p{font-size:12.5px;color:#567;line-height:1.5;margin-bottom:4px;}
.server-status{
  display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  margin-bottom:14px;padding:8px 12px;border-radius:10px;
}
.server-status.saved{background:#eafaf1;color:var(--green);}
.server-status.saving{background:#e8f4fb;color:var(--deep);}
.server-status.failed{background:#fdecea;color:#b42828;}
.server-status svg{width:14px;height:14px;flex:none;}
.sheet-actions{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;}
.action{
  display:flex;align-items:center;gap:12px;width:100%;
  border:1.5px solid #ddeef7;background:#f4fbfe;color:var(--ink);
  font-size:14px;font-weight:700;padding:13px 14px;border-radius:14px;
  cursor:pointer;text-align:left;transition:transform .1s;
}
.action:active{transform:scale(.97);}
.action.primary{background:var(--tide);border-color:var(--tide);color:#fff;}
.action svg{width:20px;height:20px;flex:none;}
.action small{display:block;font-weight:500;font-size:11px;opacity:.78;margin-top:1px;}
.sheet-cancel{width:100%;background:none;border:none;color:#89a;font-size:14px;font-weight:600;padding:12px;cursor:pointer;}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <video id="video" class="mirror" autoplay playsinline muted></video>
    <img id="frame"
         src="https://isupportblueeconomy.click/fisheries-frame-v2.png"
         alt="Blue Economy frame"
         crossorigin="anonymous">
    <img id="shot" alt="Captured selfie">
    <div id="credit">Created@Topclues</div>

    <!-- Server save status badge -->
    <div id="saveBadge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      <span id="badgeText">Saved to campaign</span>
    </div>

    <!-- Flip button -->
    <button id="flip" aria-label="Switch camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/>
        <path d="M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5"/>
        <circle cx="12" cy="12" r="3"/>
        <path d="M18 22l-3-3 3-3"/><path d="M6 2l3 3-3 3"/>
      </svg>
    </button>

    <!-- Gate -->
    <div id="gate">
      <img class="gate-logo"
           src="https://isupportblueeconomy.click/fisheries.svg"
           alt="Gujarat Fisheries">
      <h1>I Support Blue Economy</h1>
      <p>Take your selfie with the Gujarat Fisheries frame.</p>
      <label class="gate-consent">
        <input type="checkbox" id="gateConsent">
        <span>I consent to my photo being stored and used by the Gujarat Fisheries campaign.</span>
      </label>
      <button id="startBtn" disabled>Allow camera &amp; continue</button>
    </div>
  </div>

  <!-- Controls bar -->
  <div id="bar">
    <button class="btn" id="retakeBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 1 3 6.7L3 16"/><path d="M3 21v-5h5"/>
      </svg>
      Retake
    </button>
    <button id="shutter" aria-label="Take photo"></button>
    <button class="btn" id="shareBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
        <path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/>
      </svg>
      Save
    </button>
  </div>
</div>

<!-- Share / save bottom sheet -->
<div id="sheet">
  <div class="sheet-card">
    <h2>Save &amp; share your selfie</h2>
    <p>Your photo is ready. Tag <strong>https://isupportblueeconomy.click</strong></p>
    <!-- Server save status — updated dynamically -->
    <div class="server-status saving" id="serverStatus">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/>
      </svg>
      <span id="statusText">Saving to campaign gallery…</span>
    </div>
    <div class="sheet-actions">
      <button class="action primary" id="actShare">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/>
        </svg>
        <span>Share photo
          <small>Pick Instagram Feed or Stories in the share sheet</small>
        </span>
      </button>
      <button class="action" id="actCopyLink">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        <span>Copy caption
          <small>Paste in your Instagram caption or story</small>
        </span>
      </button>
      <button class="action" id="actDownload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>
        </svg>
        <span>Save to my phone</span>
      </button>
    </div>
    <button class="sheet-cancel" id="actCancel">Cancel</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ── Visit tracking (fire-and-forget on load) ─────────── */
fetch('https://isupportblueeconomy.click/track.php', { method:'POST' }).catch(()=>{});

/* ── Refs ─────────────────────────────────────────────── */
const video       = document.getElementById('video');
const frame       = document.getElementById('frame');
const shot        = document.getElementById('shot');
const gate        = document.getElementById('gate');
const gateConsent = document.getElementById('gateConsent');
const startBtn    = document.getElementById('startBtn');
const shutter     = document.getElementById('shutter');
const retakeBtn   = document.getElementById('retakeBtn');
const shareBtn    = document.getElementById('shareBtn');
const flip        = document.getElementById('flip');
const toast       = document.getElementById('toast');
const sheet       = document.getElementById('sheet');
const saveBadge   = document.getElementById('saveBadge');
const badgeText   = document.getElementById('badgeText');
const serverStatus= document.getElementById('serverStatus');
const statusText  = document.getElementById('statusText');

const FRAME_URL  = 'https://isupportblueeconomy.click/fisheries-frame-v2.png';
const UPLOAD_URL = 'https://isupportblueeconomy.click/upload.php';
const CAPTION    = 'I Support Blue Economy 🌊 Create yours → https://isupportblueeconomy.click\n\n#BlueEconomy';

// Canvas dimensions — 4:5
const W = 1080, H = 1350;

let stream       = null;
let facing       = 'user';
let lastBlob     = null;
let lastDataURL  = null;
let uploaded     = false;
let consentGiven = false;

/* ── Toast ──────────────────────────────────────────── */
function showToast(msg, dur=2600){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), dur);
}

/* ── Server badge helpers ────────────────────────────── */
function showBadge(state, msg){
  // state: 'saving' | 'saved' | 'error'
  saveBadge.className = state === 'saved' ? 'show' : (state === 'error' ? 'show error' : 'show');
  badgeText.textContent = msg;
}
function updateSheetStatus(state, msg){
  serverStatus.className = 'server-status ' + state;
  statusText.textContent = msg;
  // swap icon for saved/failed
  const icon = serverStatus.querySelector('svg');
  if(state === 'saved'){
    icon.innerHTML = '<polyline points="20 6 9 17 4 12" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  } else if(state === 'failed'){
    icon.innerHTML = '<line x1="18" y1="6" x2="6" y2="18" stroke-width="2"/><line x1="6" y1="6" x2="18" y2="18" stroke-width="2"/>';
  }
}

/* ── Camera ─────────────────────────────────────────── */
function stopStream(){
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
}

async function openCamera(){
  stopStream();
  stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ ideal: facing }, width:{ ideal:1080 }, height:{ ideal:1350 } },
    audio: false
  });
  video.srcObject = stream;
  video.classList.toggle('mirror', facing === 'user');
  await new Promise(resolve => {
    const done = () => { video.removeEventListener('canplay', done); video.removeEventListener('loadedmetadata', done); resolve(); };
    video.addEventListener('canplay', done);
    video.addEventListener('loadedmetadata', done);
    video.play().catch(resolve);
    setTimeout(resolve, 3000);
  });
}

gateConsent.addEventListener('change', () => { startBtn.disabled = !gateConsent.checked; });

async function startCamera(){
  if(!gateConsent.checked) return;
  consentGiven = true;
  startBtn.textContent = 'Starting camera…';
  startBtn.disabled = true;
  try{
    await openCamera();
    gate.classList.add('hidden');
    gate.style.display = 'none';
  }catch(e){
    gate.querySelector('h1').textContent = 'Camera blocked';
    gate.querySelector('p').textContent  = 'Enable camera in your browser settings and reload.';
    startBtn.textContent = 'Try again';
    startBtn.disabled = false;
  }
}
startBtn.addEventListener('click', startCamera);

flip.addEventListener('click', async () => {
  if(!stream) return;
  flip.style.opacity = '.4';
  facing = (facing === 'user') ? 'environment' : 'user';
  try{ await openCamera(); }
  catch(e){
    facing = (facing === 'user') ? 'environment' : 'user';
    showToast('No second camera found');
    try{ await openCamera(); }catch(_){}
  }finally{ flip.style.opacity = ''; }
});

/* ── SVG-safe frame loader ──────────────────────────── */
async function loadFrameForCanvas(){
  const test = document.createElement('canvas');
  test.width = 1; test.height = 1;
  try{
    test.getContext('2d').drawImage(frame, 0, 0, 1, 1);
    test.toDataURL();
    return frame;
  }catch(_){
    const resp = await fetch(FRAME_URL);
    const blob = await resp.blob();
    const url  = URL.createObjectURL(blob);
    return new Promise((res, rej) => {
      const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = url;
    });
  }
}

/* ── Compose 4:5 canvas ─────────────────────────────── */
async function compose(){
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // 1. Background
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // 2. Camera feed — cover-cropped to 4:5
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(W / vw, H / vh);
  const dw = vw * scale, dh = vh * scale;
  ctx.save();
  if(facing === 'user'){ ctx.translate(W, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, (W - dw) / 2, (H - dh) / 2, dw, dh);
  ctx.restore();

  // 3. Frame overlay
  try{
    const fi = await loadFrameForCanvas();
    ctx.drawImage(fi, 0, 0, W, H);
  }catch(e){ console.warn('Frame composite failed:', e); }

  // 4. Created@Topclues — left middle, vertical, black
  ctx.save();
  ctx.translate(38, H / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.font = 'bold 22px -apple-system, Segoe UI, Roboto, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,.75)';
  ctx.strokeText('Created@Topclues', 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillText('Created@Topclues', 0, 0);
  ctx.restore();

  return new Promise((res, rej) => {
    try{ canvas.toBlob(b => b ? res(b) : rej(new Error('empty blob')), 'image/png', 0.95); }
    catch(err){ rej(err); }
  });
}

/* ── Upload — with visible status ───────────────────── */
async function uploadToServer(){
  if(uploaded) return true;
  updateSheetStatus('saving', 'Saving to campaign gallery…');
  try{
    const res = await fetch(UPLOAD_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: lastDataURL })
    });
    const j = await res.json();
    if(j.ok){
      uploaded = true;
      // Update badge on stage
      showBadge('saved', '✓ Saved to campaign');
      // Update sheet status
      updateSheetStatus('saved', '✓ Saved to campaign gallery for marketing');
      return true;
    }
    updateSheetStatus('failed', '✗ Server save failed — ' + (j.error || 'unknown'));
    showBadge('error', '✗ Save failed');
    return false;
  }catch(e){
    updateSheetStatus('failed', '✗ Could not reach server');
    showBadge('error', '✗ Could not reach server');
    return false;
  }
}

/* ── Shutter ─────────────────────────────────────────── */
shutter.addEventListener('click', async () => {
  if(!stream) return;
  shutter.disabled = true;
  showToast('Capturing…', 5000);
  try{
    lastBlob = await compose();
    lastDataURL = await new Promise(r => {
      const fr = new FileReader();
      fr.onload = () => r(fr.result);
      fr.readAsDataURL(lastBlob);
    });
    shot.src = URL.createObjectURL(lastBlob);
    shot.style.display = 'block';
    retakeBtn.disabled = false;
    shareBtn.disabled  = false;
    uploaded = false;
    saveBadge.className = '';
    showToast('Photo captured ✓');

    // Auto-upload immediately after capture (consent was given at gate)
    if(consentGiven){ uploadToServer(); }

  }catch(e){
    console.error(e);
    showToast('Capture failed — try again');
  }
  shutter.disabled = false;
});

/* ── Retake ─────────────────────────────────────────── */
retakeBtn.addEventListener('click', () => {
  shot.style.display = 'none'; shot.removeAttribute('src');
  lastBlob = null; lastDataURL = null; uploaded = false;
  saveBadge.className = '';
  retakeBtn.disabled = true; shareBtn.disabled = true;
  updateSheetStatus('saving', 'Saving to campaign gallery…');
});

/* ── Share sheet ─────────────────────────────────────── */
shareBtn.addEventListener('click', () => {
  if(!lastBlob) return;
  sheet.classList.add('open');
});
document.getElementById('actCancel').addEventListener('click', () => sheet.classList.remove('open'));

/* ── Share photo (iOS-safe) ──────────────────────────── */
document.getElementById('actShare').addEventListener('click', () => {
  sheet.classList.remove('open');
  const file = new File([lastBlob], 'i-support-blue-economy.png', { type:'image/png' });

  // Copy caption to clipboard — always, critical for iOS
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(CAPTION).catch(() => fallbackCopy(CAPTION));
  }else{ fallbackCopy(CAPTION); }

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    navigator.share({ files:[file], title:'I Support Blue Economy', text: CAPTION })
      .then(() => { if(isIOS) showToast('Caption copied — paste it in your Instagram post ✓', 4000); })
      .catch(() => {});
  }else{
    const a = document.createElement('a'); a.href = lastDataURL; a.download = 'i-support-blue-economy.png'; a.click();
    showToast('Caption copied & photo saved — paste in Instagram ✓', 4000);
  }
});

/* ── Copy caption ────────────────────────────────────── */
document.getElementById('actCopyLink').addEventListener('click', () => {
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(CAPTION)
      .then(() => showToast('Caption copied — paste it in your post ✓', 3500))
      .catch(() => fallbackCopy(CAPTION));
  }else{ fallbackCopy(CAPTION); }
  sheet.classList.remove('open');
});

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); showToast('Caption copied — paste it in your post ✓'); }
  catch(e){ showToast('Copy: ' + text); }
  document.body.removeChild(ta);
}

/* ── Save to phone ───────────────────────────────────── */
document.getElementById('actDownload').addEventListener('click', () => {
  const a = document.createElement('a'); a.href = lastDataURL; a.download = 'i-support-blue-economy.png'; a.click();
  showToast('Saved to your phone ✓');
